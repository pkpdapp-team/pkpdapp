version: "2"
volumes:
  db:
services:
  app:
    image: pkpdapp
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - 443:443
      # Port 80 serves the ACME challenge and redirects to HTTPS (required for
      # certbot issuance/renewal and for the http->https redirect).
      - 80:80
    volumes:
      # Manual-cert deploy: place pkpdapp.crt / pkpdapp.key in ./.certs.
      # Mounted as a directory (not individual files) so replacing the certs is
      # picked up on an nginx reload. A dedicated /etc/ssl/pkpdapp subdir keeps
      # the system CA bundle (/etc/ssl/certs) intact.
      - ${PWD}/.certs:/etc/ssl/pkpdapp:ro
      # ACME challenge webroot (used by the certbot deploy; harmless here).
      - ${PWD}/certbot-webroot:/var/www/certbot
    restart: unless-stopped
    env_file:
     - ./.env.prod
 
  
