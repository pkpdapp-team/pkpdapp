version: "2"
volumes:
  db:
services:
  app:
    image: pkpdapp
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - 443:443
      - 80:80
    volumes:
      - ${PWD}/.certs/pkpdapp.key:/etc/ssl/pkpdapp.key
      - ${PWD}/.certs/pkpdapp.crt:/etc/ssl/pkpdapp.crt
    restart: unless-stopped
    env_file:
     - ./.env.prod
 
  
