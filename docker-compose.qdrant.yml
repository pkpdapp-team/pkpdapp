# Optional override that runs a Qdrant vector database alongside the app, for
# the chatbot's document search.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.qdrant.yml up -d
#
# Put chunks.jsonl in ./documents and fill the collection with:
#   docker compose exec app python manage.py ingest_documents /documents/chunks.jsonl
# CHATBOT_EMBEDDING_MODEL must be set in .env.prod.
version: "2.1"
volumes:
  qdrant:
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped

  app:
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ${PWD}/documents:/documents:ro
    depends_on:
      - qdrant
